<!DOCTYPE html>
<html>
<head>
  <title>XPath Recorder</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #d4d4d4;
    }

    button {
      margin: 5px;
      padding: 5px 10px;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    #actionList {
      max-height: 200px;
      overflow-y: auto;
      overflow-x: auto; /* Enables horizontal scrolling */
      border: 1px solid #3a3a3a;
      padding: 5px;
      margin-top: 10px;
      color: #4caf50;
      background-color: #2e2e2e;
      line-height: 1.6; /* Adds spacing between lines */
      white-space: nowrap; /* Prevents text wrapping */
    }
    
    /* Custom scrollbar styling */
    #actionList::-webkit-scrollbar {
      width: 8px; /* Width of vertical scrollbar */
      height: 8px; /* Height of horizontal scrollbar */
    }
    
    #actionList::-webkit-scrollbar-track {
      background: #2e2e2e; /* Track background color */
    }
    
    #actionList::-webkit-scrollbar-thumb {
      background: #4caf50; /* Thumb color */
      border-radius: 4px; /* Rounded corners for thumb */
    }
    
    #actionList::-webkit-scrollbar-thumb:hover {
      background: #45a049; /* Thumb color on hover */
        
    }
  </style>
</head>
<body>
  <div>
    <button id="startRecording">Start Recording</button>
    <button id="stopRecording" disabled>Stop Recording</button>
    <button id="resetRecording">Reset</button>
    <button id="copyActions">Copy Actions</button>
  </div>
  <div id="actionList"></div>
  <script src="popup.js"></script>
</body>
</html>
