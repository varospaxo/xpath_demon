<!DOCTYPE html>
<html>
<head>
  <title>XPath Recorder</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #d4d4d4;
    }
    
    .title-text {
      text-align: center;
      margin-bottom: 15px;
      font-size: 24px;
    }
    
    .xpath-text {
      color: white;
    }
    
    .demon-text {
      color: #4caf50;
    }

    button {
      margin: 5px;
      padding: 5px 10px;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    #actionList {
      max-height: 200px;
      overflow-y: auto;
      overflow-x: auto;
      border: 1px solid #3a3a3a;
      padding: 5px;
      margin-top: 10px;
      color: #4caf50;
      background-color: #2e2e2e;
      line-height: 1.6;
      white-space: nowrap;
    }
    
    #actionList::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    #actionList::-webkit-scrollbar-track {
      background: #2e2e2e;
    }
    
    #actionList::-webkit-scrollbar-thumb {
      background: #4caf50;
      border-radius: 4px;
    }
    
    #actionList::-webkit-scrollbar-thumb:hover {
      background: #45a049;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      margin: 10px 5px;
    }

    .checkbox-container input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }

    .checkbox-container label {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 class="title-text">
    <span class="xpath-text">XPath</span>
    <span class="demon-text">Demon</span>
  </h1>
  <div class="checkbox-container">
    <input type="checkbox" id="useIdCheckbox">
    <label for="useIdCheckbox">Use ID in XPath when available</label>
  </div>
  <div>
    <button id="startRecording">Start Recording</button>
    <button id="stopRecording" disabled>Stop Recording</button>
    <button id="resetRecording">Reset</button>
    <button id="copyActions">Copy Actions</button>
  </div>
  <div id="actionList"></div>
  <script src="popup.js"></script>
</body>
</html>
